<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midas Dictation Flow</title>
<style>
  :root {
    --paper: #FFFFFF; --ink: #111111; --ink-2: #6B6B6B; --rule: rgba(17,17,17,0.12); --paper-2: #F3F2EF;
    --volt: #CEFF00; --ok: #3DDC84; --mic: #FF9500;
    --screen: #FFFFFF; --screen-ink: #111111; --kb: #D1D3D9; --key: #FFFFFF; --key-2: #ABB0BA; --in: #E5E5EA;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #111111; --ink: #FFFFFF; --ink-2: #A3A3A3; --rule: rgba(255,255,255,0.14); --paper-2: #1C1C1C;
      --volt: #E7FF85; --screen: #000000; --screen-ink: #FFFFFF; --kb: #2B2B2E; --key: #6B6B6E; --key-2: #464649; --in: #26252A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 28px; }
  .stage { display: flex; gap: 56px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .label { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
  .caption { min-height: 28px; font-size: 20px; font-weight: 700; text-align: center; transition: opacity 200ms; }
  .steps { display: flex; gap: 6px; }
  .steps i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .steps i.on { background: var(--ink); }
  .note { margin-top: 40px; text-align: center; color: var(--ink-2); font-size: 13px; }

  /* ---------- iPhone 16 Pro, 393 x 852 at 0.76 ---------- */
  .phone { position: relative; width: 300px; height: 650px; border-radius: 48px; border: 8px solid #1a1a1a;
    background: var(--screen); color: var(--screen-ink); overflow: hidden; }
  .status { position: absolute; top: 14px; left: 30px; font-size: 13px; font-weight: 600; }
  .mic-dot { position: absolute; top: 18px; right: 40px; width: 7px; height: 7px; border-radius: 50%; background: var(--mic);
    opacity: 0; transition: opacity 200ms; z-index: 9; }
  .mic-dot.on { opacity: 1; }
  .title { position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 14px; }
  .msg { position: absolute; font-size: 13px; padding: 7px 11px; border-radius: 17px; max-width: 200px; }
  .msg.in { left: 12px; top: 92px; background: var(--in); }
  .msg.out { right: 12px; top: 136px; background: #007AFF; color: #fff; opacity: 0; transform: translateY(30px); transition: all 350ms; }
  .msg.out.on { opacity: 1; transform: none; }

  .field { position: absolute; left: 10px; right: 46px; bottom: 268px; height: 34px; border-radius: 17px;
    border: 1px solid rgba(128,128,128,0.35); font-size: 13px; padding: 8px 12px; white-space: nowrap; overflow: hidden; }
  .cursor { display: inline-block; width: 2px; height: 15px; background: #007AFF; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .send { position: absolute; right: 10px; bottom: 270px; width: 30px; height: 30px; border-radius: 50%; background: #007AFF;
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; opacity: 0.3; transition: all 200ms; }
  .send.on { opacity: 1; }
  .send.press { transform: scale(0.85); }

  .paste { position: absolute; left: 22px; bottom: 310px; background: #2C2C2E; color: #fff; font-size: 13px; border-radius: 9px;
    display: flex; overflow: hidden; opacity: 0; transform: scale(0.8); transition: all 180ms; }
  .paste span { padding: 8px 12px; }
  .paste span:first-child { border-right: 1px solid #48484A; }
  .paste.on { opacity: 1; transform: none; }
  .paste.press span:first-child { background: #48484A; }
  .touch { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: rgba(128,128,128,0.35);
    opacity: 0; transform: scale(0.6); transition: all 160ms; pointer-events: none; z-index: 8; }
  .touch.on { opacity: 1; transform: none; }

  /* Apple keyboard, unchanged: 😊 bottom left, mic bottom right */
  .kb { position: absolute; left: 0; right: 0; bottom: 0; height: 258px; background: var(--kb); padding: 8px 4px 0; }
  .row { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
  .k { width: 24px; height: 38px; background: var(--key); border-radius: 5px; font-size: 15px; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
  .k.w { width: 36px; background: var(--key-2); font-size: 13px; }
  .k.sp { width: 140px; font-size: 13px; }
  .k.rt { width: 62px; background: var(--key-2); font-size: 13px; }
  .sysrow { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 26px; font-size: 22px; }

  /* Dynamic Island */
  .island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 98px; height: 30px; background: #000;
    border-radius: 18px; z-index: 10; color: #fff; overflow: hidden;
    transition: width 420ms cubic-bezier(.3,1.3,.5,1), height 420ms cubic-bezier(.3,1.3,.5,1), border-radius 420ms; }
  @media (prefers-color-scheme: dark) {
    .island, .mpill { box-shadow: 0 0 0 1px rgba(255,255,255,0.22); }
  }
  .island.open { width: 272px; height: 96px; border-radius: 34px; }
  .island.pill { width: 200px; height: 36px; }
  .island-in { position: absolute; inset: 0; padding: 14px 16px; display: flex; gap: 12px; align-items: center; opacity: 0; transition: opacity 200ms; }
  .island.open .island-in, .island.pill .island-in { opacity: 1; transition-delay: 180ms; }
  .island.pill .island-in { padding: 6px 12px; }
  .itext { flex: 1; font-size: 13px; line-height: 1.3; }
  .itext .raw { color: #9A9A9F; }
  .itext .clean { color: #fff; font-weight: 600; }
  .ilabel { font-size: 13px; font-weight: 600; flex: 1; }

  /* jess orb (DESIGN.md 5a) */
  .orb { position: relative; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid #111;
    box-shadow: 2px 2px 0 #111, 0 0 12px rgba(255,255,255,0.55); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .island.pill .orb { width: 24px; height: 24px; }
  .orb i { width: 12px; height: 12px; border-radius: 50%; background: #111; transition: background 200ms, transform 200ms; }
  .orb.listen i { background: #CEFF00; animation: pulse 0.5s ease-in-out infinite alternate; }
  .orb.done i { background: var(--ok); animation: none; }
  .orb.think::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent;
    border-top-color: #CEFF00; animation: spin 0.7s linear infinite; }
  @keyframes pulse { from { transform: scale(0.8); } to { transform: scale(1.25); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wave { display: flex; gap: 3px; align-items: center; height: 26px; }
  .wave s { width: 3px; height: 6px; background: #CEFF00; border-radius: 2px; text-decoration: none; display: block; }
  .wave.live s { animation: bar 0.45s ease-in-out infinite alternate; }
  .wave s:nth-child(2) { animation-delay: .1s; } .wave s:nth-child(3) { animation-delay: .2s; }
  .wave s:nth-child(4) { animation-delay: .05s; } .wave s:nth-child(5) { animation-delay: .15s; }
  @keyframes bar { from { height: 4px; } to { height: 22px; } }

  /* double-tap on the back */
  .backtap { position: absolute; right: 18px; top: 300px; z-index: 11; pointer-events: none; }
  .ring { position: absolute; width: 60px; height: 60px; margin: -30px; border-radius: 50%; border: 3px solid #CEFF00;
    box-shadow: 0 0 0 1px #111; opacity: 0; }
  .ring.go { animation: ring 0.45s ease-out; }
  .ring.second.go { animation-delay: 0.22s; }
  @keyframes ring { 0% { opacity: 1; transform: scale(0.3); } 100% { opacity: 0; transform: scale(1.3); } }
  .phone-wrap { position: relative; }
  .back-label { position: absolute; right: -86px; top: 286px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 200ms; }
  .back-label.on { opacity: 1; }

  /* ---------- Mac ---------- */
  .mac { width: 440px; }
  .screen { width: 440px; height: 290px; border-radius: 14px; border: 10px solid #1a1a1a; background: linear-gradient(135deg, #E8E6E1, #CFCCC6);
    position: relative; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .screen { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); } }
  .chin { width: 470px; height: 14px; margin: 0 -15px; background: #BDBDBD; border-radius: 0 0 10px 10px; }
  .win { position: absolute; left: 24px; top: 24px; right: 24px; height: 180px; background: var(--screen); color: var(--screen-ink);
    border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); padding: 30px 14px 14px; font-size: 13px; }
  .lights { position: absolute; top: 10px; left: 12px; display: flex; gap: 6px; }
  .lights i { width: 10px; height: 10px; border-radius: 50%; background: #FF5F57; }
  .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
  .mfield { border: 1px solid rgba(128,128,128,0.35); border-radius: 8px; padding: 10px; min-height: 90px; }
  .mpill { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(60px); background: #000; color: #fff;
    border-radius: 20px; padding: 6px 14px 6px 8px; display: flex; gap: 10px; align-items: center; transition: transform 300ms cubic-bezier(.3,1.3,.5,1); }
  .mpill.on { transform: translateX(-50%) translateY(0); }
  .mpill .orb { width: 24px; height: 24px; }
  .keys { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .kk { min-width: 46px; height: 40px; border-radius: 7px; background: var(--paper-2); border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 120ms; }
  .kk.fn.down { background: #CEFF00; color: #111; transform: translateY(2px); box-shadow: inset 0 0 0 2px #111; }
</style>
</head>
<body>
<main>
  <h1>Dictation, final</h1>

  <div class="stage">
    <!-- iPhone -->
    <div class="col">
      <div class="label">iPhone</div>
      <div class="phone-wrap">
        <div class="phone" id="phone">
          <div class="status">9:41</div>
          <div class="mic-dot" id="micDot"></div>
          <div class="island" id="island">
            <div class="island-in">
              <div class="orb" id="orb"><i></i></div>
              <div class="itext" id="islandText"></div>
              <div class="wave" id="wave"><s></s><s></s><s></s><s></s><s></s></div>
            </div>
          </div>
          <div class="title">Sam</div>
          <div class="msg in">What time tonight?</div>
          <div class="msg out" id="sent">Be there at 6.</div>
          <div class="paste" id="paste"><span>Paste</span><span>AutoFill</span></div>
          <div class="field" id="field"><span class="cursor"></span></div>
          <div class="send" id="send">↑</div>
          <div class="touch" id="touch"></div>
          <div class="kb">
            <div class="row"><div class="k">q</div><div class="k">w</div><div class="k">e</div><div class="k">r</div><div class="k">t</div><div class="k">y</div><div class="k">u</div><div class="k">i</div><div class="k">o</div><div class="k">p</div></div>
            <div class="row"><div class="k">a</div><div class="k">s</div><div class="k">d</div><div class="k">f</div><div class="k">g</div><div class="k">h</div><div class="k">j</div><div class="k">k</div><div class="k">l</div></div>
            <div class="row"><div class="k w">⇧</div><div class="k">z</div><div class="k">x</div><div class="k">c</div><div class="k">v</div><div class="k">b</div><div class="k">n</div><div class="k">m</div><div class="k w">⌫</div></div>
            <div class="row"><div class="k w">123</div><div class="k sp">space</div><div class="k rt">return</div></div>
            <div class="sysrow"><span>😊</span><span>🎙</span></div>
          </div>
          <div class="backtap"><div class="ring first" id="ring1"></div><div class="ring second" id="ring2"></div></div>
        </div>
        <div class="back-label" id="backLabel">tap tap<br>(back)</div>
      </div>
      <div class="caption" id="phoneCaption"></div>
      <div class="steps" id="phoneSteps"></div>
    </div>

    <!-- Mac -->
    <div class="col mac">
      <div class="label">Mac</div>
      <div>
        <div class="screen">
          <div class="win">
            <div class="lights"><i></i><i></i><i></i></div>
            <div class="mfield" id="macField"><span class="cursor"></span></div>
          </div>
          <div class="mpill" id="macPill">
            <div class="orb" id="macOrb"><i></i></div>
            <div class="wave" id="macWave"><s></s><s></s><s></s><s></s><s></s></div>
          </div>
        </div>
        <div class="chin"></div>
      </div>
      <div class="keys"><div class="kk">⌃</div><div class="kk fn" id="fnKey">fn</div><div class="kk">⌥</div><div class="kk">⌘</div></div>
      <div class="caption" id="macCaption"></div>
      <div class="steps" id="macSteps"></div>
    </div>
  </div>

  <div class="note">Keyboard untouched · 😊 stays · Midas runs only while you talk · on-device speech</div>
</main>

<script>
  // ---------- helpers ----------
  const RAW_WORDS = ["um", "so", "like", "be", "there", "at", "5", "no", "wait", "6"];
  const CLEAN_TEXT = "Be there at 6.";
  const CURSOR_HTML = '<span class="cursor"></span>';

  function getElement(elementId) {
    return document.getElementById(elementId);
  }

  function setOn(elementId, isOn) {
    getElement(elementId).classList.toggle("on", isOn);
  }

  // Restarts a CSS animation by removing the class, forcing a reflow, and adding it back.
  function replayAnimation(elementId, className) {
    const element = getElement(elementId);
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
  }

  function setOrbState(orbId, stateName) {
    const orb = getElement(orbId);
    orb.className = "orb " + stateName;
  }

  function buildDots(containerId, count) {
    const container = getElement(containerId);
    for (let index = 0; index < count; index += 1) {
      container.appendChild(document.createElement("i"));
    }
  }

  function showStep(stepsId, captionId, stepIndex, captionText) {
    const dotList = getElement(stepsId).querySelectorAll("i");
    dotList.forEach(function markDot(dot, dotIndex) {
      dot.classList.toggle("on", dotIndex === stepIndex);
    });
    getElement(captionId).textContent = captionText;
  }

  // Runs a list of [delayMs, action] pairs, then starts over.
  function runLoop(timeline, totalMs) {
    timeline.forEach(function scheduleAction(entry) {
      setTimeout(entry[1], entry[0]);
    });
    setTimeout(function restartLoop() {
      runLoop(timeline, totalMs);
    }, totalMs);
  }

  // Adds one raw word to a target, so the transcript appears as it is spoken.
  function buildWordTimeline(startMs, stepMs, renderWords) {
    const entries = RAW_WORDS.map(function makeWordEntry(word, wordIndex) {
      const wordsSoFar = RAW_WORDS.slice(0, wordIndex + 1).join(" ");
      return [startMs + wordIndex * stepMs, function showWords() { renderWords(wordsSoFar); }];
    });
    return entries;
  }

  // ---------- iPhone ----------
  const PHONE_STEPS = 5;
  buildDots("phoneSteps", PHONE_STEPS);

  function phoneReset() {
    getElement("island").className = "island";
    getElement("islandText").innerHTML = "";
    getElement("field").innerHTML = CURSOR_HTML;
    setOrbState("orb", "");
    getElement("wave").className = "wave";
    setOn("micDot", false);
    setOn("paste", false);
    setOn("send", false);
    setOn("sent", false);
    setOn("touch", false);
    setOn("backLabel", false);
    showStep("phoneSteps", "phoneCaption", 0, "Any app, any field");
  }

  function phoneDoubleTap() {
    showStep("phoneSteps", "phoneCaption", 1, "Double-tap the back");
    setOn("backLabel", true);
    replayAnimation("ring1", "go");
    replayAnimation("ring2", "go");
  }

  function phoneListen() {
    setOn("backLabel", false);
    showStep("phoneSteps", "phoneCaption", 2, "Speak");
    getElement("island").className = "island open";
    setOrbState("orb", "listen");
    getElement("wave").className = "wave live";
    setOn("micDot", true);
  }

  function phoneShowRaw(wordsSoFar) {
    getElement("islandText").innerHTML = '<span class="raw">' + wordsSoFar + "</span>";
  }

  function phoneThink() {
    setOrbState("orb", "think");
    getElement("wave").className = "wave";
    setOn("micDot", false);
  }

  function phoneCleaned() {
    showStep("phoneSteps", "phoneCaption", 3, "Cleaned · copied");
    setOrbState("orb", "done");
    getElement("islandText").innerHTML = '<span class="clean">' + CLEAN_TEXT + "</span>";
  }

  function phoneCollapse() {
    getElement("island").className = "island";
  }

  function phoneTouchField() {
    showStep("phoneSteps", "phoneCaption", 4, "Tap · Paste");
    const touch = getElement("touch");
    touch.style.left = "70px";
    touch.style.top = "352px";
    setOn("touch", true);
    setOn("paste", true);
  }

  function phoneTouchPaste() {
    const touch = getElement("touch");
    touch.style.left = "30px";
    touch.style.top = "312px";
    getElement("paste").classList.add("press");
  }

  function phonePasted() {
    getElement("paste").className = "paste";
    setOn("touch", false);
    getElement("field").innerHTML = CLEAN_TEXT + CURSOR_HTML;
    setOn("send", true);
  }

  function phoneSend() {
    getElement("send").classList.add("press");
    setTimeout(function releaseSend() {
      getElement("send").classList.remove("press");
      getElement("field").innerHTML = CURSOR_HTML;
      setOn("send", false);
      setOn("sent", true);
    }, 160);
  }

  const phoneWordEntries = buildWordTimeline(2700, 260, phoneShowRaw);
  const phoneTimeline = [
    [0, phoneReset],
    [1400, phoneDoubleTap],
    [2300, phoneListen]
  ].concat(phoneWordEntries, [
    [5600, phoneThink],
    [6500, phoneCleaned],
    [8000, phoneCollapse],
    [8500, phoneTouchField],
    [9300, phoneTouchPaste],
    [9700, phonePasted],
    [10600, phoneSend]
  ]);
  runLoop(phoneTimeline, 12800);

  // ---------- Mac ----------
  const MAC_STEPS = 3;
  buildDots("macSteps", MAC_STEPS);

  function macReset() {
    getElement("macField").innerHTML = CURSOR_HTML;
    getElement("fnKey").classList.remove("down");
    setOn("macPill", false);
    setOrbState("macOrb", "");
    getElement("macWave").className = "wave";
    showStep("macSteps", "macCaption", 0, "Any app, any field");
  }

  function macHoldFn() {
    showStep("macSteps", "macCaption", 1, "Hold fn · speak");
    getElement("fnKey").classList.add("down");
    setOn("macPill", true);
    setOrbState("macOrb", "listen");
    getElement("macWave").className = "wave live";
  }

  function macRelease() {
    getElement("fnKey").classList.remove("down");
    setOrbState("macOrb", "think");
    getElement("macWave").className = "wave";
  }

  function macTyped() {
    showStep("macSteps", "macCaption", 2, "Let go · typed in");
    setOrbState("macOrb", "done");
    getElement("macField").innerHTML = CLEAN_TEXT + CURSOR_HTML;
  }

  function macHidePill() {
    setOn("macPill", false);
  }

  const macTimeline = [
    [0, macReset],
    [1400, macHoldFn],
    [5600, macRelease],
    [6500, macTyped],
    [7600, macHidePill]
  ];
  runLoop(macTimeline, 12800);
</script>
</body>
</html>
